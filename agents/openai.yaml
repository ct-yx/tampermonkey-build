interface:
  display_name: "Tampermonkey Build"
  short_description: "开发、调试、测试并发布浏览器 userscript"
  brand_color: "#2563EB"
  default_prompt: "使用 $tampermonkey-build：以本地 userscript 源码为唯一开发基准，完成 metadata 检查、node --check、项目行为测试，并在 Edge + Tampermonkey 中验证；必要时用 Codex 内置浏览器观察 DOM/布局。只在明确要求迁移时执行独立的扩展迁移流程。"

policy:
  allow_implicit_invocation: true
